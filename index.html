<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colmado Rodríguez - Pedidos en Línea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Colmado Rodríguez</h1>
            <p class="tagline">¡Frías como novia de muñeco!</p>
        </div>

         <div class="header-actions">
            <button id="btn-carrito" class="btn-cart">
                Carrito <span id="cart-count">0</span>
            </button>
        </div>

        <nav class="nav-menu">
            <a href="#productos-sec">Productos</a>
        </nav>

    </header>

   <main>

        <section class="hero">
            <h2>¿Qué te llevamos hoy?</h2>
            <p>Selecciona tus productos y te los mandamos por WhatsApp de una vez.</p>
        </section>

        <section id="productos-sec" class="filtros">
            <button class="btn-filtro active" onclick="filtrarProductos('todos')">Todos</button>
            <button class="btn-filtro" onclick="filtrarProductos('frias')">Frías</button>
            <button class="btn-filtro" onclick="filtrarProductos('viveres')">Víveres</button>
            <button class="btn-filtro" onclick="filtrarProductos('provisiones')">Provisiones</button>
        </section>

        <section class="productos">
            <div class="grid-productos" id="contenedor-productos"></div>
        </section>
    </main>

    <div id="modal-carrito" class="modal">
        <div class="modal-content">
            <span class="cerrar" onclick="cerrarModalCarrito()">&times;</span>
            <h2>Tu Pedido</h2>
            <div id="items-carrito" class="lista-items"></div>

            <form id="form-pedido">
                <label for="nombre">Tu Nombre:</label>
                <input type="text" id="nombre" placeholder="Ej: Pedro Pérez" required>

                <label>Tipo de Entrega:</label>
                <div>
                    <label><input type="radio" name="tipo_entrega" value="Delivery" checked onclick="toggleDelivery(true)"> Delivery</label>
                    <label><input type="radio" name="tipo_entrega" value="Retiro en Tienda" onclick="toggleDelivery(false)"> Retiro en Colmado</label>
                </div>

                <div id="sec-direccion">
                    <label for="direccion">Dirección / Sector:</label>
                    <input type="text" id="direccion" placeholder="Ej: C/ Central #12">
                </div>

                <div class="cajero-box">
                    <h4>Método de Pago</h4>
                    <div>
                        <label><input type="radio" name="metodo_pago" value="Efectivo" checked onclick="cambiarMetodoPago('Efectivo')"> Efectivo</label>
                        <label><input type="radio" name="metodo_pago" value="Tarjeta" onclick="cambiarMetodoPago('Tarjeta')"> Tarjeta</label>
                    </div>

                    <div id="sec-efectivo">
                        <label for="monto-pago">¿Con cuánto vas a pagar? (RD$):</label>
                        <input type="number" id="monto-pago" placeholder="Ej: 1000" oninput="calcularDevuelta()">
                        <p id="info-devuelta">Devuelta: <strong>RD$ 0</strong></p>
                    </div>
                </div>
            </form>

            <button type="submit" class="btn-whatsapp-send">Enviar Pedido a la Caja</button>

            <div class="total-container">
                <h3>Total: <span id="total-precio">RD$ 0</span></h3>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
